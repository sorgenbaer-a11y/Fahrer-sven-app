<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#17212b'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='style.css'><title>Fahrer Sven Engels</title></head><body>
<header><h1>Fahrer Sven Engels</h1><p>Stundenabrechnung</p></header>
<nav><button class='tab active' data-tab='today'>Heute</button><button class='tab' data-tab='month'>Monat</button><button class='tab' data-tab='accounts'>Konten</button></nav>
<main>
<section id='today' class='panel active'><h2 id='dateTitle'></h2><label>Status<select id='status'><option value='Arbeit'>Arbeit</option><option>Krank</option><option>Urlaub</option><option>Feiertag</option></select></label><div class='grid'><label>Arbeitsbeginn<input id='start' type='time'></label><label>Pause von<input id='pauseStart' type='time'></label><label>Pause bis<input id='pauseEnd' type='time'></label><label>Arbeitsende<input id='end' type='time'></label></div><button id='save' class='primary'>Tag speichern</button><div class='cards'><div><span>Ist</span><strong id='actual'>0,00</strong></div><div><span>Soll</span><strong id='target'>9,70</strong></div><div><span>Saldo</span><strong id='balance'>0,00</strong></div></div></section>
<section id='month' class='panel'><div class='monthhead'><button id='prev'>‹</button><h2 id='monthTitle'></h2><button id='next'>›</button></div><div id='monthList'></div><div class='summary'><b>Monat</b><span>Ist: <strong id='mActual'>0,00</strong> Std.</span><span>Soll: <strong id='mTarget'>0,00</strong> Std.</span><span>Saldo: <strong id='mBalance'>0,00</strong> Std.</span></div><button id='exportCsv'>CSV exportieren</button></section>
<section id='accounts' class='panel'><h2>Konten</h2><label>Startbestand Überstunden<input id='overtimeStart' type='number' step='0.01'></label><label>Urlaubsanspruch<input id='vacationTotal' type='number' step='1'></label><div class='cards vertical'><div><span>Überstundenkonto inkl. erfasster Salden</span><strong id='overtimeBalance'>0,00 Std.</strong></div><div><span>Genommener Urlaub</span><strong id='vacationUsed'>0 Tage</strong></div><div><span>Resturlaub</span><strong id='vacationLeft'>30 Tage</strong></div></div><button id='saveSettings' class='primary'>Konten speichern</button><button id='backup'>Datensicherung herunterladen</button><label class='import'>Datensicherung einlesen<input id='restore' type='file' accept='application/json'></label></section>
</main><footer>Daten werden lokal auf diesem Gerät gespeichert.</footer><script src='app.js'></script></body></html>
